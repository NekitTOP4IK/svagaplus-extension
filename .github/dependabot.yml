version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Etc/UTC"

    versioning-strategy: "increase-if-necessary"

    open-pull-requests-limit: 5

    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      dev-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Etc/UTC"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    commit-message:
      prefix: "ci"
