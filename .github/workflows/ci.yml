name: CI/CD

on:
  # Разработка идёт на staging, поэтому без него CI был бы post-merge гейтом,
  # при том что джоба release публикует GitHub Release сразу после мержа в main.
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build all channels
        run: |
          npm run build
          npm run build:firefox
          npm run build:prod:firefox
          npm run build:prod

      - name: Verify built manifests and channels
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { readBuildInfo } = require('./scripts/build-channel.cjs');
          const expected = require('./package.json').version;

          const cases = [
            ['dist/chrome-dev',   'staging'],
            ['dist/firefox-dev',  'staging'],
            ['dist/chrome-prod',  'prod'],
            ['dist/firefox-prod', 'prod'],
          ];

          for (const [dir, channel] of cases) {
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
            if (manifest.version !== expected) {
              throw new Error(`${dir}: expected version ${expected}, got ${manifest.version}`);
            }
            const info = readBuildInfo(dir);
            if (info.channel !== channel) {
              throw new Error(`${dir}: expected channel ${channel}, got ${info.channel}`);
            }
            if (JSON.stringify(manifest).includes('__')) {
              throw new Error(`${dir}: unsubstituted placeholder in manifest`);
            }
          }

          // CI-сторона предохранителя канала: в prod-сборку не должен просочиться
          // staging-бэкенд.
          const prod = readBuildInfo('dist/chrome-prod');
          if (prod.backendUrl.includes('staging')) {
            throw new Error(`prod build points at a staging backend: ${prod.backendUrl}`);
          }
          console.log('manifests and channels verified');
          NODE

  release:
    name: Release browser archives
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      - name: Build production archives
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build:prod
          npm run build:prod:firefox
          (cd dist/firefox-prod && zip -rq "../../artifacts/svagaplus-extension-firefox-v${VERSION}.zip" .)

      - name: Verify release archives
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHROME="artifacts/svagaplus-extension-chrome-v${VERSION}.zip"
          FIREFOX="artifacts/svagaplus-extension-firefox-v${VERSION}.zip"
          test -s "$CHROME"
          test -s "$FIREFOX"
          unzip -t "$CHROME"
          unzip -t "$FIREFOX"
          unzip -Z1 "$CHROME" | grep -Fx manifest.json
          unzip -Z1 "$FIREFOX" | grep -Fx manifest.json

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "artifacts/svagaplus-extension-chrome-v${VERSION}.zip" \
            "artifacts/svagaplus-extension-firefox-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
