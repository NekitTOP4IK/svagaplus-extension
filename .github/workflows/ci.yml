name: CI/CD

on:
  # Разработка идёт на staging, поэтому без него CI был бы post-merge гейтом,
  # при том что джоба release публикует GitHub Release сразу после мержа в main.
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build all channels
        run: |
          npm run build
          npm run build:firefox
          npm run build:prod:firefox
          npm run build:prod

      - name: Verify built manifests and channels
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { readBuildInfo } = require('./scripts/build-channel.cjs');
          const expected = require('./package.json').version;

          const cases = [
            ['dist/chrome-dev',   'staging'],
            ['dist/firefox-dev',  'staging'],
            ['dist/chrome-prod',  'prod'],
            ['dist/firefox-prod', 'prod'],
          ];

          for (const [dir, channel] of cases) {
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
            if (manifest.version !== expected) {
              throw new Error(`${dir}: expected version ${expected}, got ${manifest.version}`);
            }
            const info = readBuildInfo(dir);
            if (info.channel !== channel) {
              throw new Error(`${dir}: expected channel ${channel}, got ${info.channel}`);
            }
            if (JSON.stringify(manifest).includes('__')) {
              throw new Error(`${dir}: unsubstituted placeholder in manifest`);
            }
          }

          // CI-сторона предохранителя канала: в prod-сборку не должен просочиться
          // staging-бэкенд.
          const prod = readBuildInfo('dist/chrome-prod');
          if (prod.backendUrl.includes('staging')) {
            throw new Error(`prod build points at a staging backend: ${prod.backendUrl}`);
          }
          console.log('manifests and channels verified');
          NODE

      # Архивы собираются здесь, а release только публикует проверенные файлы:
      # так в джобу с правом записи не попадают npm и сторонний код сборки.
      - name: Package release archives
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHROME="artifacts/svagaplus-extension-chrome-v${VERSION}.zip"
          FIREFOX="artifacts/svagaplus-extension-firefox-v${VERSION}.zip"
          (cd dist/firefox-prod && zip -rq "../../${FIREFOX}" .)
          for archive in "$CHROME" "$FIREFOX"; do
            test -s "$archive"
            unzip -tq "$archive"
            unzip -Z1 "$archive" | grep -Fxq manifest.json
          done
          (cd artifacts && sha256sum -- *.zip > SHA256SUMS)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-archives
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release browser archives
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.test.outputs.version }}

    steps:
      - name: Check release version
        id: release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download archives
        if: steps.release.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-archives
          path: artifacts

      - name: Attest build provenance
        if: steps.release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.zip

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        run: |
          gh release create "$TAG" artifacts/*.zip artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
