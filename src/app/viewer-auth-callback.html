<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Свага+</title>
    <style>
      /* Kept inline: this page is opened by the OAuth redirect and must paint
         instantly, before any stylesheet round-trip. Palette mirrors popup.css. */
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0f;
        color: #efeff1;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0f;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -30% -10% auto -10%;
        height: 60vh;
        background: radial-gradient(
          50% 60% at 50% 40%,
          rgba(145, 71, 255, 0.24) 0%,
          rgba(145, 71, 255, 0) 70%
        );
        pointer-events: none;
        animation: fade-in 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .shell {
        position: relative;
        width: min(360px, calc(100vw - 32px));
        padding: 24px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.035);
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.9);
        animation: card-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        margin: 0 auto 14px;
        display: block;
        box-shadow: 0 0 0 1px rgba(145, 71, 255, 0.24),
          0 10px 26px -12px rgba(145, 71, 255, 0.9);
        animation: mark-in 520ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #a4a4b0;
        font-size: 13.5px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes mark-in {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <img class="mark" src="../../icons/icon64.png" alt="" />
      <h1 id="title">Свага+</h1>
      <p id="status">Подключение аккаунта...</p>
    </main>
    <script src="viewer-auth-callback.js"></script>
  </body>
</html>
