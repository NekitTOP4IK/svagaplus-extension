<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Свага+</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="../features/update-notice/notice.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img class="brand-mark" src="../../icons/icon64.png" alt="" />
        <div class="brand-copy">
          <h1>Свага+</h1>
          <p>Свагометр и соц. рейтинг</p>
        </div>
      </header>

      <div id="updateNotice" class="update-notice-slot"></div>

      <section class="panel reveal" aria-labelledby="accountTitle">
        <div class="panel-head">
          <h2 id="accountTitle">Аккаунт</h2>
          <span id="connectionState" class="pill pill--loading" role="status" aria-live="polite">
            Проверка…
          </span>
        </div>

        <div class="account-stack">
          <!-- initial load -->
          <div id="loadingAccount" class="account-state is-active" aria-hidden="true">
            <div class="skeleton skeleton--avatar"></div>
            <div class="account-copy">
              <div class="skeleton skeleton--line skeleton--w60"></div>
              <div class="skeleton skeleton--line skeleton--w40"></div>
            </div>
          </div>

          <!-- connected -->
          <div id="connectedAccount" class="account-state">
            <div class="avatar-wrap">
              <div id="accountAvatarFallback" class="avatar-fallback" aria-hidden="true"></div>
              <img id="accountAvatar" class="avatar" alt="" hidden />
            </div>
            <div class="account-copy">
              <div id="accountLogin" class="account-login"></div>
              <div id="accountTelegramMeta" class="account-meta">
                <span id="accountTelegramWarning" class="account-meta-icon" hidden aria-hidden="true">
                  <svg viewBox="0 0 20 20" focusable="false">
                    <path d="M10 2.5 18 17.5H2L10 2.5Zm0 4.2a.9.9 0 0 0-.9.9v4.5a.9.9 0 1 0 1.8 0V7.6a.9.9 0 0 0-.9-.9Zm0 8.2a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2Z" />
                  </svg>
                </span>
                <span id="accountTelegram"></span>
              </div>
            </div>
          </div>

          <!-- disconnected -->
          <div id="disconnectedAccount" class="account-state">
            <div class="account-copy">
              <div class="account-login">Аккаунт не подключен</div>
              <div class="account-meta-plain">Войдите, используя кнопочку ниже</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="primaryAction" class="button button--primary" type="button">
            <span id="primaryActionSpinner" class="button-spinner" hidden aria-hidden="true"></span>
            <span id="primaryActionLabel">Подключить аккаунт</span>
          </button>
          <button id="secondaryAction" class="button button--text" type="button" hidden>Выйти</button>
        </div>
      </section>

      <section id="metricsPanel" class="panel metrics reveal" aria-labelledby="metricsTitle">
        <div class="panel-head">
          <h2 id="metricsTitle">Мои показатели</h2>
          <span id="metricsChannel" class="metrics-channel" aria-hidden="true"></span>
        </div>
        <p id="metricsState" class="metrics-state" role="status" aria-live="polite">Войдите, чтобы увидеть показатели.</p>
        <dl id="metricsValues" class="metrics-values" hidden>
          <div>
            <dt>Свагометр</dt>
            <dd id="swagScore">—</dd>
          </div>
          <div>
            <dt>Соц. рейтинг</dt>
            <dd id="socialScore">—</dd>
          </div>
        </dl>
      </section>

      <section class="panel reveal" aria-labelledby="settingsTitle">
        <div class="panel-head">
          <h2 id="settingsTitle">Настройки</h2>
        </div>

        <label class="setting setting--toggle" for="socialRatingToggle">
          <div class="setting-copy">
            <div class="setting-label">Соц. рейтинг</div>
            <div class="setting-note">Для применения изменений обновите страницу.</div>
          </div>
          <input id="socialRatingToggle" class="switch-input" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting setting--toggle" for="customNicknamesToggle">
          <div class="setting-copy">
            <div class="setting-label">Кастомные ники</div>
            <div class="setting-note">Баджи продолжат отображаться.</div>
          </div>
          <input id="customNicknamesToggle" class="switch-input" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section id="aliasesPanel" class="panel reveal" aria-labelledby="aliasesTitle">
        <div class="panel-head">
          <h2 id="aliasesTitle">Алиасы</h2>
          <span id="aliasCount" class="metrics-channel"></span>
        </div>

        <p id="aliasEmpty" class="alias-empty">
          Пока пусто. Переименовать зрителя можно карандашом в его карточке на Twitch.
        </p>
        <ul id="aliasList" class="alias-list" hidden></ul>

        <div class="alias-actions">
          <button id="aliasExport" class="button button--secondary button--small" type="button">Экспорт</button>
          <button id="aliasImport" class="button button--secondary button--small" type="button">Импорт</button>
          <button id="aliasSync" class="button button--text button--small" type="button" hidden>
            <span id="aliasSyncSpinner" class="button-spinner" hidden aria-hidden="true"></span>
            Синхронизировать
          </button>
          <input id="aliasImportFile" type="file" accept=".json,application/json" hidden />
        </div>
        <p id="aliasStatus" class="alias-status" role="status" aria-live="polite" hidden></p>
      </section>

      <div id="popupErrorSlot" class="toast-slot">
        <div class="toast-clip">
          <section id="popupErrorBanner" class="toast" role="alert" aria-live="assertive">
            <div class="toast-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M10 2.5 18 17.5H2L10 2.5Zm0 4.2a.9.9 0 0 0-.9.9v4.5a.9.9 0 1 0 1.8 0V7.6a.9.9 0 0 0-.9-.9Zm0 8.2a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2Z" />
              </svg>
            </div>
            <div class="toast-copy">
              <div id="popupErrorTitle" class="toast-title"></div>
              <div id="popupErrorDetail" class="toast-detail"></div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
